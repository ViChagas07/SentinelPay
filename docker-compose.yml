name: paysentineliq

x-app-build: &app-build
  context: .
  dockerfile: backend/Dockerfile

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-0}
  CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-900}
  CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-960}
  ANALYSIS_TASK_MAX_RETRIES: ${ANALYSIS_TASK_MAX_RETRIES:-3}
  ANALYSIS_MAX_CONCURRENT_PER_USER: ${ANALYSIS_MAX_CONCURRENT_PER_USER:-2}
  ANALYSIS_LEASE_SECONDS: ${ANALYSIS_LEASE_SECONDS:-900}
  ANALYSIS_STALE_SWEEP_SECONDS: ${ANALYSIS_STALE_SWEEP_SECONDS:-300}
  PAYABLES_REMINDER_INTERVAL_SECONDS: ${PAYABLES_REMINDER_INTERVAL_SECONDS:-120}
  PAYABLES_OVERDUE_INTERVAL_SECONDS: ${PAYABLES_OVERDUE_INTERVAL_SECONDS:-600}
  PAYABLES_REMINDER_LOOKBACK_DAYS: ${PAYABLES_REMINDER_LOOKBACK_DAYS:-7}
  FRAUD_MODEL_DIR: ${FRAUD_MODEL_DIR:-models/artifacts}
  LLM_INTERPRETER: ${LLM_INTERPRETER:-structured}
  RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY}
  RATE_LIMIT_REFILL_PER_SEC: ${RATE_LIMIT_REFILL_PER_SEC}
  SECURITY_HASH_SECRET: ${SECURITY_HASH_SECRET}
  SWR_SOFT_TTL_SECONDS: ${SWR_SOFT_TTL_SECONDS}
  SWR_HARD_TTL_SECONDS: ${SWR_HARD_TTL_SECONDS}
  SWR_JITTER_RATIO: ${SWR_JITTER_RATIO}
  SWR_LOCK_TTL_SECONDS: ${SWR_LOCK_TTL_SECONDS}
  SWR_WAIT_TIMEOUT_SECONDS: ${SWR_WAIT_TIMEOUT_SECONDS}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES}
  REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS}
  BRUTEFORCE_MAX_ATTEMPTS: ${BRUTEFORCE_MAX_ATTEMPTS}
  BRUTEFORCE_WINDOW_SECONDS: ${BRUTEFORCE_WINDOW_SECONDS}
  BRUTEFORCE_BASE_BLOCK_SECONDS: ${BRUTEFORCE_BASE_BLOCK_SECONDS}
  BRUTEFORCE_MAX_BLOCK_SECONDS: ${BRUTEFORCE_MAX_BLOCK_SECONDS}
  SSRF_ALLOWED_HOSTS: ${SSRF_ALLOWED_HOSTS}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
  FRONTEND_URL: ${FRONTEND_URL}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN}
  OIDC_STATE_TTL_SECONDS: ${OIDC_STATE_TTL_SECONDS}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  S3_ENDPOINT_URL: http://minio:9000
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_BUCKET: ${S3_BUCKET}
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB}
  PDF_MAX_PAGES: ${PDF_MAX_PAGES}
  S3_PRESIGNED_URL_TTL_SECONDS: ${S3_PRESIGNED_URL_TTL_SECONDS}
  OCR_LANGS: ${OCR_LANGS}
  OCR_MAX_PAGES: ${OCR_MAX_PAGES}
  OCR_RENDER_DPI: ${OCR_RENDER_DPI}
  OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS}
  OCR_MAX_IMAGE_PIXELS: ${OCR_MAX_IMAGE_PIXELS}
  OCR_NATIVE_MIN_CHARS: ${OCR_NATIVE_MIN_CHARS}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL}
  EMBEDDING_DIM: ${EMBEDDING_DIM}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE}
  EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES}
  EMBEDDING_RETRY_BACKOFF_SECONDS: ${EMBEDDING_RETRY_BACKOFF_SECONDS}
  VECTOR_STORE: ${VECTOR_STORE}
  PINECONE_API_KEY: ${PINECONE_API_KEY}
  PINECONE_INDEX: ${PINECONE_INDEX}
  PINECONE_NAMESPACE: ${PINECONE_NAMESPACE}
  RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE}
  RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP}
  RAG_FAKE_EMBEDDER: ${RAG_FAKE_EMBEDDER}
  HYBRID_RETRIEVAL_ENABLED: ${HYBRID_RETRIEVAL_ENABLED:-0}
  HYBRID_FUSION: ${HYBRID_FUSION:-rrf}
  HYBRID_RRF_K: ${HYBRID_RRF_K:-60}
  HYBRID_DENSE_WEIGHT: ${HYBRID_DENSE_WEIGHT:-0.6}
  HYBRID_SPARSE_WEIGHT: ${HYBRID_SPARSE_WEIGHT:-0.4}
  QUERY_EMBEDDING_CACHE_TTL_SECONDS: ${QUERY_EMBEDDING_CACHE_TTL_SECONDS:-3600}
  RETRIEVAL_MODEL_DIR: ${RETRIEVAL_MODEL_DIR:-models/retrieval}
  RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-25}
  RERANK_TOP_N: ${RERANK_TOP_N:-4}
  RERANK_ENABLED: ${RERANK_ENABLED:-1}
  EMBEDDER_BACKEND: ${EMBEDDER_BACKEND:-onnx}
  RERANKER_BACKEND: ${RERANKER_BACKEND:-onnx}
  RERANKER_REMOTE_URL: ${RERANKER_REMOTE_URL:-}
  RERANKER_REMOTE_API_KEY: ${RERANKER_REMOTE_API_KEY:-}
  RERANKER_REMOTE_MODEL: ${RERANKER_REMOTE_MODEL:-BAAI/bge-reranker-v2-m3}
  RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-30}
  RERANK_MAX_LENGTH: ${RERANK_MAX_LENGTH:-512}
  BATCH_SIZE: ${BATCH_SIZE:-16}
  TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-0}
  LLM_BASE_URL: ${LLM_BASE_URL}
  LLM_API_KEY: ${LLM_API_KEY}
  LLM_MODEL: ${LLM_MODEL}
  LLM_JUDGE_MODEL: ${LLM_JUDGE_MODEL}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS}
  LLM_MAX_SCORE_ADJUSTMENT: ${LLM_MAX_SCORE_ADJUSTMENT}
  LLM_LANGUAGE: ${LLM_LANGUAGE}
  AI_NODE_TIMEOUT_SECONDS: ${AI_NODE_TIMEOUT_SECONDS}
  GUARDRAIL_CLASSIFIER_ENABLED: ${GUARDRAIL_CLASSIFIER_ENABLED}
  GUARDRAIL_CLASSIFIER_THRESHOLD: ${GUARDRAIL_CLASSIFIER_THRESHOLD}
  GUARDRAIL_CLASSIFIER_MODEL_DIR: ${GUARDRAIL_CLASSIFIER_MODEL_DIR}
  GUARDRAIL_JUDGE_ENABLED: ${GUARDRAIL_JUDGE_ENABLED}
  GUARDRAIL_MAX_TEXT_CHARS: ${GUARDRAIL_MAX_TEXT_CHARS}
  GUARDRAIL_LLM_EXCERPT_CHARS: ${GUARDRAIL_LLM_EXCERPT_CHARS}
  GUARDRAIL_ALLOWED_OUTPUT_URLS: ${GUARDRAIL_ALLOWED_OUTPUT_URLS}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-paysentineliq-api}
  OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-0.1.0}
  OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1.0}
  OTEL_EXPORTER_TIMEOUT_SECONDS: ${OTEL_EXPORTER_TIMEOUT_SECONDS:-5}
  LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-}
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
  LANGFUSE_SAMPLE_RATE: ${LANGFUSE_SAMPLE_RATE:-1.0}
  METRICS_TOKEN: ${METRICS_TOKEN}
  QUEUE_DEPTH_REFRESH_SECONDS: ${QUEUE_DEPTH_REFRESH_SECONDS:-15}
  CREWAI_DISABLE_TELEMETRY: ${CREWAI_DISABLE_TELEMETRY}
  CREWAI_DISABLE_TRACKING: ${CREWAI_DISABLE_TRACKING}
  CREWAI_TRACING_ENABLED: ${CREWAI_TRACING_ENABLED}
  LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING}
  ANONYMIZED_TELEMETRY: ${ANONYMIZED_TELEMETRY}
  SMTP_HOST: mailpit
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_FROM: ${SMTP_FROM:-no-reply@paysentineliq.local}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-0}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
  NOTIFICATIONS_DELIVERY_MAX_RETRIES: ${NOTIFICATIONS_DELIVERY_MAX_RETRIES:-3}
  NOTIFICATIONS_DELIVERY_RETRY_BACKOFF_SECONDS: ${NOTIFICATIONS_DELIVERY_RETRY_BACKOFF_SECONDS:-60}
  SMS_PROVIDER: ${SMS_PROVIDER:-console}
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-console}

services:
  api:
    build: *app-build
    image: paysentineliq-api:local
    environment:
      <<: *app-environment
      PROMETHEUS_MULTIPROC_DIR: /var/run/prometheus/api
      PROMETHEUS_MULTIPROC_SCRAPE_DIRS: /var/run/prometheus/api,/var/run/prometheus/worker,/var/run/prometheus/beat
    volumes:
      - ./models:/app/models:ro
      - prometheus_multiproc:/var/run/prometheus
    ports:
      - "${API_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build: *app-build
    image: paysentineliq-api:local
    command:
      [
        "celery",
        "-A",
        "paysentineliq.infrastructure.messaging.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--pool=solo",
        "--concurrency=1",
        "--prefetch-multiplier=1",
        "-Q",
        "analysis,notifications,scheduler",
      ]
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: paysentineliq-worker
      PROMETHEUS_MULTIPROC_DIR: /var/run/prometheus/worker
    volumes:
      - ./models:/app/models:ro
      - prometheus_multiproc:/var/run/prometheus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: *app-build
    image: paysentineliq-api:local
    command:
      [
        "celery",
        "-A",
        "paysentineliq.infrastructure.messaging.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: paysentineliq-beat
      PROMETHEUS_MULTIPROC_DIR: /var/run/prometheus/beat
    volumes:
      - prometheus_multiproc:/var/run/prometheus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1.8-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infra/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.9.2
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0-busybox
    profiles: ["observability"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed "s|__METRICS_TOKEN__|$${METRICS_TOKEN}|g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --web.enable-lifecycle
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN}
    volumes:
      - ./infra/observability/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      - ./infra/observability/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.6
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  mailpit_data:
  prometheus_multiproc:
  prometheus_data:
  grafana_data:
  tempo_data:



