name: paysentineliq

x-app-build: &app-build
  context: ./backend
  dockerfile: Dockerfile

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-0}
  CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-900}
  CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-960}
  ANALYSIS_TASK_MAX_RETRIES: ${ANALYSIS_TASK_MAX_RETRIES:-3}
  ANALYSIS_MAX_CONCURRENT_PER_USER: ${ANALYSIS_MAX_CONCURRENT_PER_USER:-2}
  ANALYSIS_LEASE_SECONDS: ${ANALYSIS_LEASE_SECONDS:-900}
  ANALYSIS_STALE_SWEEP_SECONDS: ${ANALYSIS_STALE_SWEEP_SECONDS:-300}
  PAYABLES_REMINDER_INTERVAL_SECONDS: ${PAYABLES_REMINDER_INTERVAL_SECONDS:-120}
  PAYABLES_OVERDUE_INTERVAL_SECONDS: ${PAYABLES_OVERDUE_INTERVAL_SECONDS:-600}
  PAYABLES_REMINDER_LOOKBACK_DAYS: ${PAYABLES_REMINDER_LOOKBACK_DAYS:-7}
  FRAUD_MODEL_DIR: ${FRAUD_MODEL_DIR:-models/artifacts}
  LLM_INTERPRETER: ${LLM_INTERPRETER:-structured}
  RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY}
  RATE_LIMIT_REFILL_PER_SEC: ${RATE_LIMIT_REFILL_PER_SEC}
  SECURITY_HASH_SECRET: ${SECURITY_HASH_SECRET}
  SWR_SOFT_TTL_SECONDS: ${SWR_SOFT_TTL_SECONDS}
  SWR_HARD_TTL_SECONDS: ${SWR_HARD_TTL_SECONDS}
  SWR_JITTER_RATIO: ${SWR_JITTER_RATIO}
  SWR_LOCK_TTL_SECONDS: ${SWR_LOCK_TTL_SECONDS}
  SWR_WAIT_TIMEOUT_SECONDS: ${SWR_WAIT_TIMEOUT_SECONDS}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES}
  REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS}
  BRUTEFORCE_MAX_ATTEMPTS: ${BRUTEFORCE_MAX_ATTEMPTS}
  BRUTEFORCE_WINDOW_SECONDS: ${BRUTEFORCE_WINDOW_SECONDS}
  BRUTEFORCE_BASE_BLOCK_SECONDS: ${BRUTEFORCE_BASE_BLOCK_SECONDS}
  BRUTEFORCE_MAX_BLOCK_SECONDS: ${BRUTEFORCE_MAX_BLOCK_SECONDS}
  SSRF_ALLOWED_HOSTS: ${SSRF_ALLOWED_HOSTS}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
  FRONTEND_URL: ${FRONTEND_URL}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN}
  OIDC_STATE_TTL_SECONDS: ${OIDC_STATE_TTL_SECONDS}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  S3_ENDPOINT_URL: http://minio:9000
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_BUCKET: ${S3_BUCKET}
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB}
  PDF_MAX_PAGES: ${PDF_MAX_PAGES}
  S3_PRESIGNED_URL_TTL_SECONDS: ${S3_PRESIGNED_URL_TTL_SECONDS}
  OCR_LANGS: ${OCR_LANGS}
  OCR_MAX_PAGES: ${OCR_MAX_PAGES}
  OCR_RENDER_DPI: ${OCR_RENDER_DPI}
  OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS}
  OCR_MAX_IMAGE_PIXELS: ${OCR_MAX_IMAGE_PIXELS}
  OCR_NATIVE_MIN_CHARS: ${OCR_NATIVE_MIN_CHARS}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL}
  EMBEDDING_DIM: ${EMBEDDING_DIM}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE}
  EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES}
  EMBEDDING_RETRY_BACKOFF_SECONDS: ${EMBEDDING_RETRY_BACKOFF_SECONDS}
  VECTOR_STORE: ${VECTOR_STORE}
  PINECONE_API_KEY: ${PINECONE_API_KEY}
  PINECONE_INDEX: ${PINECONE_INDEX}
  PINECONE_NAMESPACE: ${PINECONE_NAMESPACE}
  RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE}
  RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP}
  RAG_FAKE_EMBEDDER: ${RAG_FAKE_EMBEDDER}
  LLM_BASE_URL: ${LLM_BASE_URL}
  LLM_API_KEY: ${LLM_API_KEY}
  LLM_MODEL: ${LLM_MODEL}
  LLM_JUDGE_MODEL: ${LLM_JUDGE_MODEL}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS}
  LLM_MAX_SCORE_ADJUSTMENT: ${LLM_MAX_SCORE_ADJUSTMENT}
  LLM_LANGUAGE: ${LLM_LANGUAGE}
  AI_NODE_TIMEOUT_SECONDS: ${AI_NODE_TIMEOUT_SECONDS}
  GUARDRAIL_CLASSIFIER_ENABLED: ${GUARDRAIL_CLASSIFIER_ENABLED}
  GUARDRAIL_CLASSIFIER_THRESHOLD: ${GUARDRAIL_CLASSIFIER_THRESHOLD}
  GUARDRAIL_CLASSIFIER_MODEL_DIR: ${GUARDRAIL_CLASSIFIER_MODEL_DIR}
  GUARDRAIL_JUDGE_ENABLED: ${GUARDRAIL_JUDGE_ENABLED}
  GUARDRAIL_MAX_TEXT_CHARS: ${GUARDRAIL_MAX_TEXT_CHARS}
  GUARDRAIL_LLM_EXCERPT_CHARS: ${GUARDRAIL_LLM_EXCERPT_CHARS}
  GUARDRAIL_ALLOWED_OUTPUT_URLS: ${GUARDRAIL_ALLOWED_OUTPUT_URLS}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED}
  CREWAI_DISABLE_TELEMETRY: ${CREWAI_DISABLE_TELEMETRY}
  CREWAI_DISABLE_TRACKING: ${CREWAI_DISABLE_TRACKING}
  CREWAI_TRACING_ENABLED: ${CREWAI_TRACING_ENABLED}
  LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING}
  ANONYMIZED_TELEMETRY: ${ANONYMIZED_TELEMETRY}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_FROM: ${SMTP_FROM:-no-reply@paysentineliq.local}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-0}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
  NOTIFICATIONS_DELIVERY_MAX_RETRIES: ${NOTIFICATIONS_DELIVERY_MAX_RETRIES:-3}
  NOTIFICATIONS_DELIVERY_RETRY_BACKOFF_SECONDS: ${NOTIFICATIONS_DELIVERY_RETRY_BACKOFF_SECONDS:-60}
  SMS_PROVIDER: ${SMS_PROVIDER:-console}
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-console}

services:
  api:
    build: *app-build
    image: paysentineliq-api:local
    environment: *app-environment
    ports:
      - "${API_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build: *app-build
    image: paysentineliq-api:local
    command:
      [
        "celery",
        "-A",
        "paysentineliq.infrastructure.messaging.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--pool=solo",
        "--concurrency=1",
        "--prefetch-multiplier=1",
        "-Q",
        "analysis,notifications,scheduler",
      ]
    environment: *app-environment
    volumes:
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: *app-build
    image: paysentineliq-api:local
    command:
      [
        "celery",
        "-A",
        "paysentineliq.infrastructure.messaging.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1.8-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  mailpit_data:



