[tool.poetry]
name = "paysentineliq"
version = "0.1.0"
description = "Backend antifraude do PaySentinelIQ."
packages = [{ include = "paysentineliq", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = "^0.162.7"
uvicorn = "^0.54.0"
pydantic-settings = "^2.16.3"
sqlalchemy = {extras = ["asyncio"], version = "^2.1.8"}
asyncpg = "^0.32.0"
alembic = "^1.20.1"
redis = "^8.1.0"
httpx = "^0.28.1"
authlib = "^1.9.5"
boto3 = "^1.44.3"
pypdf = "^7.1.0"
python-multipart = "^0.0.33"
pymupdf = "^2.1"
pillow = "^13.0.0"
paddlepaddle = "^3.3.1"
paddleocr = "^3.7.0"
opencv-contrib-python = "4.10.0.84"
pyyaml = "^6.0.2"
scikit-learn = "^1.9.1"
joblib = "^1.6.0"
pgvector = "^0.5.1"
pinecone = "^10.3.0"
crewai = "1.15.41"
langgraph = "^1.2.22"
langchain-core = "^1.8.0"
celery = "^5.7.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.5,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "import-linter (>=2.16,<3.0)",
    "pip-audit (==2.9.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "types-authlib (>=1.8.0.20261106,<2.0.0.0)",
    "types-psutil (>=7.2.2.20261111,<8.0.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)",
    "types-pyyaml (>=6.0.12.20261113,<7.0.0.0)"
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["paysentineliq"]

[tool.ruff.lint.per-file-ignores]
"src/paysentineliq/infrastructure/security/ssrf.py" = ["ASYNC109"]
"tests/unit/test_safe_http_client.py" = ["ASYNC109"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "celery", "celery.*", "kombu", "kombu.*", "crewai", "crewai.*", "cv2", "joblib", "joblib.*", "langchain", "langchain.*", "langchain_core", "langchain_core.*", "langgraph", "langgraph.*", "paddleocr", "paddleocr.*", "paddle", "paddle.*", "paddlex", "paddlex.*", "pymupdf", "pymupdf.*", "fitz", "sklearn", "sklearn.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast tests without external services",
    "integration: tests that may use local services",
    "docker: tests that require docker compose up and --run-docker",
    "manual: tests that need a real local LLM and are opt-in",
]

[tool.coverage.run]
source = ["paysentineliq"]

[tool.coverage.report]
show_missing = true
skip_covered = true
omit = ["tests/*"]

[tool.importlinter]
root_packages = ["paysentineliq"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "paysentineliq.interface",
    "paysentineliq.infrastructure",
    "paysentineliq.application",
    "paysentineliq.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application independent of frameworks"
type = "forbidden"
source_modules = [
    "paysentineliq.domain",
    "paysentineliq.application",
]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "redis",
    "uvicorn",
    "pydantic_settings",
]

[[tool.importlinter.contracts]]
name = "Queries do not import commands"
type = "forbidden"
source_modules = ["paysentineliq.application.queries"]
forbidden_modules = ["paysentineliq.application.commands"]

[[tool.importlinter.contracts]]
name = "Commands do not import queries"
type = "forbidden"
source_modules = ["paysentineliq.application.commands"]
forbidden_modules = ["paysentineliq.application.queries"]

[[tool.importlinter.contracts]]
name = "Queries do not use write unit of work"
type = "forbidden"
source_modules = ["paysentineliq.application.queries"]
forbidden_modules = [
    "paysentineliq.application.ports.document_unit_of_work",
    "paysentineliq.application.ports.auth_unit_of_work",
]

[[tool.importlinter.contracts]]
name = "Domain does not import application"
type = "forbidden"
source_modules = ["paysentineliq.domain"]
forbidden_modules = ["paysentineliq.application"]



