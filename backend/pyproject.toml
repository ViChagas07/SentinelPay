[tool.poetry]
name = "paysentineliq"
version = "0.1.0"
description = "Backend antifraude do PaySentinelIQ."
packages = [{ include = "paysentineliq", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = "^0.162.7"
uvicorn = "^0.54.0"
pydantic-settings = "^2.16.3"
sqlalchemy = {extras = ["asyncio"], version = "^2.1.8"}
asyncpg = "^0.32.0"
alembic = "^1.20.1"
redis = "^8.1.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.5,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "import-linter (>=2.16,<3.0)"
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["paysentineliq"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast tests without external services",
    "integration: tests that may use local services",
    "docker: tests that require docker compose up and --run-docker",
]

[tool.coverage.run]
source = ["paysentineliq"]

[tool.coverage.report]
show_missing = true
skip_covered = true
omit = ["tests/*"]

[tool.importlinter]
root_packages = ["paysentineliq"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "paysentineliq.interface",
    "paysentineliq.infrastructure",
    "paysentineliq.application",
    "paysentineliq.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application independent of frameworks"
type = "forbidden"
source_modules = [
    "paysentineliq.domain",
    "paysentineliq.application",
]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "redis",
    "uvicorn",
    "pydantic_settings",
]
